name: freerdp-tvos-spike

# 코드 0줄 스파이크. 묻는 것은 하나다 — libfreerdp + winpr 가 appletvos arm64 로 빌드되는가.
# 앱 코드를 쓰기 전에 가장 큰 불확실성을 먼저 깬다. 실패해도 손실은 CI 시간뿐이다.
on:
  workflow_dispatch:
    inputs:
      freerdp_ref:
        description: 'FreeRDP 태그 (비우면 최신 3.x 자동 선택)'
        required: false
        default: ''
      deployment_target:
        description: 'tvOS 배포 타깃'
        required: false
        default: '16.0'
  push:
    paths:
      - 'spike/freerdp-tvos/**'
      - '.github/workflows/freerdp-tvos-spike.yml'

jobs:
  spike:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || xcode-select -p

      - name: Run spike
        id: spike
        continue-on-error: true    # 실패가 곧 결과다. 중단하지 않고 보고서를 만든다.
        shell: bash
        env:
          FREERDP_REF: ${{ inputs.freerdp_ref != '' && inputs.freerdp_ref || 'auto' }}
          DEPLOY_TARGET: ${{ inputs.deployment_target || '16.0' }}
          WORK: ${{ runner.temp }}/spike-work
          OUT: ${{ github.workspace }}/spike-out
        run: bash spike/freerdp-tvos/run.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f spike-out/spike-report.md ]; then
            cat spike-out/spike-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '보고서가 생성되지 않았다. 러너 환경 문제다.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # 로그가 아티팩트 한도를 넘지 않게 자른다.
          for f in spike-out/*.log spike-out/cmake-cache.txt; do
            [ -f "$f" ] && [ "$(stat -f%z "$f")" -gt 5000000 ] && tail -c 5000000 "$f" > "$f.tail" && mv "$f.tail" "$f"
          done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freerdp-tvos-spike
          path: spike-out/
          if-no-files-found: warn
